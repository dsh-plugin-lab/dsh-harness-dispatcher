# Release. The chain itself — guards, build, publish, tag, Release, draft retirement — is shared, in
# dsh-plugin-lab/.github/.github/workflows/release-publish.yml. What stays here is what is this
# repository's own: the triggers, the environment name, and the permissions the called job inherits.
#
# Since 2026-11-14 this is the family's pilot for the shared flow: it was the repository whose copy
# differed from the template in no structural line, so a failure here points at the call, not at an
# edit. The decision and what it rules out → .agents/notes/ (organization repository).
#
# Changing this file means dispatching it once for real: pull-request CI runs ci.yml only, so a green
# check says nothing about whether the release path works.
name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the "no behaviour change, no release" guard (only for a release that carries docs or tooling only)'
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write # the called job pushes the tag, the commit and the Release
  id-token: write # npm Trusted Publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: dsh-plugin-lab/.github/.github/workflows/release-publish.yml@main
    with:
      # Must equal the environment named on this package's Trusted Publisher, word for word. The
      # OIDC exchange fails with a 404 that does not say why when the two differ.
      environment: release
      force: ${{ inputs.force || false }}
