# pnpm workspace root. Declared even with a single package — otherwise pnpm treats this as a
# non-workspace directory and the dependency tree stops matching the one CI installs.
packages:
  - '.'
# minimumReleaseAgeExclude：pnpm 11 的供应链门禁默认拒收「发布不足 24 小时」的版本，
# 而本仓跟的是宿主的 rc 线 —— 刚发布的 rc 天然落在 24 小时内，不放行就装不上。
# CI 的 `pnpm install --frozen-lockfile` 就停在第一步（2026-11-13 rc.3 实踩）。
#
# 逐条列出被拒的那批宿主包，而不是关掉整道门禁：门禁对**其余每个包**继续生效。
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-preset-registry@0.2.2-rc.3'
  - '@deepseek-ai/dsh-agent@0.2.2-rc.3'
  - '@deepseek-ai/dsh-app-boot@0.2.2-rc.3'
  - '@deepseek-ai/dsh-atomic-write@0.2.2-rc.3'
  - '@deepseek-ai/dsh-attachment@0.2.2-rc.3'
  - '@deepseek-ai/dsh-brand@0.2.2-rc.3'
  - '@deepseek-ai/dsh-chunked-list@0.2.2-rc.3'
  - '@deepseek-ai/dsh-config-editor@0.2.2-rc.3'
  - '@deepseek-ai/dsh-error@0.2.2-rc.3'
  - '@deepseek-ai/dsh-fs-patch@0.2.2-rc.3'
  - '@deepseek-ai/dsh-fs@0.2.2-rc.3'
  - '@deepseek-ai/dsh-home-paths@0.2.2-rc.3'
  - '@deepseek-ai/dsh-launch-environment@0.2.2-rc.3'
  - '@deepseek-ai/dsh-llm@0.2.2-rc.3'
  - '@deepseek-ai/dsh-native-command@0.2.2-rc.3'
  - '@deepseek-ai/dsh-official-bundles@0.2.2-rc.3'
  - '@deepseek-ai/dsh-package-manifest@0.2.2-rc.3'
  - '@deepseek-ai/dsh-sandbox@0.2.2-rc.3'
  - '@deepseek-ai/dsh-scope@0.2.2-rc.3'
  - '@deepseek-ai/dsh-session-projection@0.2.2-rc.3'
